name: app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 工具链
        run: |
          sw_vers
          swift --version
          xcodebuild -version
      - name: 单元测试（EvoCore）
        run: swift test
      - name: 打包 Evo.app + Evo.dmg（ad-hoc 签名）
        run: make dmg
      - name: 检查包内容
        run: |
          plutil -p build/Evo.app/Contents/Info.plist | grep -E 'LSUIElement|CFBundleShortVersionString|CFBundleIdentifier'
          codesign -dv build/Evo.app 2>&1 | grep -E 'Signature|Identifier'
          test -x build/Evo.app/Contents/MacOS/Evo
          test -f build/Evo.app/Contents/Resources/evo/bin/evo
          test -f build/Evo.app/Contents/Resources/evo/panel/index.html
          test -f build/Evo.app/Contents/Resources/evo/install.sh
          test ! -e build/Evo.app/Contents/Resources/evo/bin/evo_plugin.py   # 第二十四轮删了插件（#16）
          test -f build/Evo.app/Contents/Resources/evo/schemas/status.schema.json
          test -f build/Evo.app/Contents/Resources/evo/features/team/feature.json
          test -f build/Evo.app/Contents/Resources/evo/schemas/feature-list.schema.json
          grep -q '"CFBundleShortVersionString" => "0.8.0"' <(plutil -p build/Evo.app/Contents/Info.plist)
          test -f build/Evo.app/Contents/Resources/mate/index.html
          test -f build/Evo.app/Contents/Resources/vendor/emotion-ball/js/engine.js
          test -f build/Evo.app/Contents/Resources/vendor/NOTICE.md
          test -f build/Evo.app/Contents/Resources/AppIcon.icns
          plutil -p build/Evo.app/Contents/Info.plist | grep -q '"CFBundleIconFile" => "AppIcon"'
          sips -g pixelWidth -g pixelHeight build/Evo.app/Contents/Resources/AppIcon.icns
          ! grep -rE "fonts\.googleapis|fonts\.gstatic" build/Evo.app/Contents/Resources/mate build/Evo.app/Contents/Resources/vendor
          du -sh build/Evo.app build/Evo.dmg
      - name: 自带 evo 能跑（空的 EVO_HOME）
        env:
          EVO_HOME: ${{ runner.temp }}/evo-smoke/projects
          EVO_PANEL_KEYCHAIN: "0"
        run: |
          mkdir -p "$EVO_HOME"
          python3 build/Evo.app/Contents/Resources/evo/bin/evo projects
          python3 build/Evo.app/Contents/Resources/evo/bin/evo --help | head -5
          python3 build/Evo.app/Contents/Resources/evo/bin/evo projects --json
          python3 build/Evo.app/Contents/Resources/evo/bin/evo feature list --json > /dev/null
          bash build/Evo.app/Contents/Resources/evo/install.sh | tail -5 || true
          # 跑完不能在签过名的包里留下 __pycache__
          if find build/Evo.app -name __pycache__ | grep -q .; then echo "包里出现 __pycache__"; exit 1; fi
          codesign --verify --deep --strict build/Evo.app
      - name: 界面截图（make snapshots）
        timeout-minutes: 8
        run: make snapshots
      - name: 装录屏 / 点击工具（ffmpeg、cliclick）
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg cliclick || brew install cliclick || true
      - name: 实机演示（真桌面截图 + 录屏，mac-demo）
        timeout-minutes: 12
        run: bash scripts/mac-demo.sh build/Evo.app build/mac-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-demo
          path: |
            app/build/mac-demo
          if-no-files-found: warn
          retention-days: 2  # 公开仓库：构件含第三方角色形象，只短期留
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: app/build/snapshots
          if-no-files-found: error
          retention-days: 2  # 公开仓库：构件含第三方角色形象，只短期留
      - uses: actions/upload-artifact@v4
        with:
          name: Evo.dmg
          path: app/build/Evo.dmg
          if-no-files-found: error
          retention-days: 2  # 公开仓库：构件含第三方角色形象，只短期留
