name: Bug
description: 某个东西坏了
labels: ["triage"]
body:
  - type: textarea
    id: what
    attributes: {label: 现象, description: 你看到了什么}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: 复现步骤, description: 从打开到出错的每一步、在哪个界面/入口}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 期望}
    validations: {required: true}
  - type: textarea
    id: raw
    attributes: {label: 原始数据, description: 截图、日志、配置文件原文（请去掉密钥）。修复会直接用这些数据写测试}
  - type: input
    id: version
    attributes: {label: 版本 / 环境}
