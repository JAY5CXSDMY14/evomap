<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>evo · 看效果</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e5e3de; --accent:#2f6f4f; --warn:#b4541a; --red:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  .switch { position:relative; }
  .switch button.cur { font:inherit; font-weight:600; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:6px 12px; cursor:pointer; display:flex; gap:8px; align-items:center; }
  .menu { display:none; position:absolute; top:44px; left:0; min-width:240px; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.08); padding:6px; }
  .menu.open { display:block; }
  .menu a { display:flex; justify-content:space-between; gap:10px; padding:8px 10px; border-radius:8px; color:inherit; text-decoration:none; cursor:pointer; }
  .menu a:hover, .menu a.on { background:var(--bg); }
  .menu .sep { height:1px; background:var(--line); margin:4px 0; }
  .badge { min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--red); color:#fff; font-size:12px; display:inline-flex; align-items:center; justify-content:center; }
  .badge.zero { background:var(--line); color:var(--mute); }
  .others { font-size:13px; color:var(--mute); }
  .others b { color:var(--red); }
  main { max-width:880px; margin:0 auto; padding:16px; }
  h2 { font-size:13px; letter-spacing:.06em; color:var(--mute); margin:22px 0 8px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .gate .q { font-weight:600; margin-bottom:10px; }
  .gate .proj { font-size:12px; color:var(--mute); margin-bottom:4px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { font:inherit; border:0; border-radius:10px; padding:7px 14px; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.ghost { background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  .btn.warn { background:var(--warn); }
  input[type=text], select, textarea { font:inherit; flex:1; min-width:180px; border:1px solid var(--line); border-radius:10px; padding:7px 10px; background:#fff; }
  textarea { width:100%; min-height:64px; resize:vertical; }
  table { width:100%; border-collapse:collapse; }
  td { padding:8px 6px; border-top:1px solid var(--line); vertical-align:top; }
  tr:first-child td { border-top:0; }
  td.key { font-family:ui-monospace,Menlo,monospace; font-size:13px; white-space:nowrap; }
  .st { font-size:13px; padding:2px 8px; border-radius:8px; background:var(--bg); white-space:nowrap; }
  .st.stuck { background:#fde8e4; color:var(--red); }
  .st.done { background:#e5f2ea; color:var(--accent); }
  .log { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:var(--mute); white-space:pre-wrap; }
  .empty { color:var(--mute); }
  .sum { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .sum .card { cursor:pointer; margin:0; }
  .sum .n { font-size:13px; color:var(--mute); }
  /* 第十二轮：结构性样式，只用已有变量；整体换皮之后再统一调 */
  .roles { display:flex; gap:8px; flex-wrap:wrap; }
  .role { font-size:13px; padding:4px 10px; border-radius:8px; background:var(--bg); border:1px solid var(--line); }
  .role.role-busy { border-color:var(--accent); }
  .role.role-paused, .role.role-rate_limited { border-color:var(--warn); }
  .alert { border-color:var(--red); }
  .alert .ttl, .nolive-mark { color:var(--red); }
  tr.item-row { cursor:pointer; }
  .artifacts { margin:10px 0; display:grid; gap:8px; }
  .artifact img { max-width:100%; border:1px solid var(--line); border-radius:8px; }
  .artifact iframe { width:100%; height:360px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .artifact .name, .checks { font-size:13px; color:var(--mute); }
  .timeline { list-style:none; margin:0; padding:0; }
  .timeline li { padding:6px 0; border-top:1px solid var(--line); }
  .timeline li:first-child { border-top:0; }
  .timeline .ev { font-weight:600; }
  .timeline .at { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mute); margin-right:8px; }
  .timeline .words { white-space:pre-wrap; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 14px; border-radius:10px; display:none; }
</style>
</head>
<body>
<header>
  <div class="switch">
    <button class="cur" id="cur" onclick="toggleMenu()"><span id="curName">…</span><span id="curBadge" class="badge zero">0</span> ▾</button>
    <div class="menu" id="menu"></div>
  </div>
  <div class="others" id="others"></div><a class="others" href="logout" style="margin-left:auto">退出</a>
</header>
<main id="main"><p class="empty">加载中…</p></main>
<div class="toast" id="toast"></div>
<script>
let projects = [], cur = localStorage.getItem("evo.project") || "", data = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 口令过期/没登录：接口回 401 → 刷新回到登录页
async function api(url, opt){ const r = await fetch(url, opt); if (r.status === 401) { location.reload(); throw new Error("要口令"); } return r.json(); }
function toast(t){ const el=$("toast"); el.textContent=t; el.style.display="block"; setTimeout(()=>el.style.display="none",2200); }
function toggleMenu(){ $("menu").classList.toggle("open"); }
document.addEventListener("click", e => { if (!e.target.closest(".switch")) $("menu").classList.remove("open"); });

async function loadProjects(){
  projects = await api("api/projects");
  if (cur !== "*" && !projects.find(p => p.code === cur)) cur = projects.length === 1 ? projects[0].code : "*";
  const total = projects.reduce((a,p)=>a+p.gates,0);
  $("menu").innerHTML =
    `<a class="${cur==="*"?"on":""}" onclick="pick('*')"><span>全部待办</span><span class="badge ${total?"":"zero"}">${total}</span></a><div class="sep"></div>` +
    projects.map(p => `<a class="${cur===p.code?"on":""}" onclick="pick('${p.code}')"><span>${esc(p.name)} <span class="others">${p.code}</span></span><span class="badge ${p.gates?"":"zero"}">${p.gates}</span></a>`).join("") +
    `<div class="sep"></div><a onclick="alert('新开：evo new <代号> --name 名字 --path 目录\\n导入：evo import <代号> --name 名字 --path 旧仓库')"><span>＋ 新开 / 导入项目</span></a>`;
  const me = projects.find(p => p.code === cur);
  $("curName").textContent = cur === "*" ? "全部待办" : (me ? me.name : "—");
  const n = cur === "*" ? total : (me ? me.gates : 0);
  $("curBadge").textContent = n; $("curBadge").className = "badge" + (n ? "" : " zero");
  // 别的项目在等你：头部常驻提示，不会漏
  const other = projects.filter(p => p.code !== cur && p.gates > 0);
  $("others").innerHTML = cur !== "*" && other.length ? "其他项目在等你：" + other.map(p => `<a onclick="pick('${p.code}')" style="cursor:pointer">${esc(p.name)} <b>${p.gates}</b></a>`).join("、") : "";
}

function pick(code){ if (location.hash) history.replaceState(null, "", location.pathname); cur = code; localStorage.setItem("evo.project", code); $("menu").classList.remove("open"); refresh(); }

// 第二十五轮（#12）：面板只读，只用来看效果。批卡在 Telegram 卡片上点；Telegram 不方便时在 Mac 上跑 evo approve
const KIND_NAMES = {do: "做不做", look: "看效果", ship: "上线"};
function gateCard(g, code, name){
  const opts = g.options || ["通过","打回"];
  return `<div class="card gate">${name?`<div class="proj">${esc(name)}</div>`:""}<div class="q">${esc(KIND_NAMES[g.kind]||"待定")} · ${esc(g.question)}</div>${g.confirm?`<div class="others">Orca 端（手机或工人）点的「${esc(g.orca_choice||"?")}」不直接算数，要在 Telegram 里再点一次才生效（试运行）</div>`:""}
    <div class="others">去 Telegram 卡片上点「${opts.map(esc).join(" / ")}」；Telegram 不方便：<code>evo -p ${esc(code)} approve ${esc(g.id)} ${esc(opts[0])}</code></div>
    ${g.kind==="look" && g.item ? `<div class="artifacts" data-code="${esc(code)}" data-item="${esc(g.item)}"><span class="others">产出物读取中…</span></div>` : ""}</div>`;
}

// 看效果闸门里直接看产出物：图片原样显示；HTML 放进沙盒 iframe（只许脚本，绝不给同源权限），并加 CSP 断网；其余给下载链接
const ART_CSP = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; connect-src 'none'; form-action 'none'">`;
const artUrl = (code, item, path) => `api/artifact/${code}/${encodeURIComponent(item)}/` + path.split("/").map(encodeURIComponent).join("/");
async function loadArtifacts(el){
  const code = el.dataset.code, item = el.dataset.item;
  let a; try { a = await api(`api/artifacts/${code}/${encodeURIComponent(item)}`); } catch (e) { return; }
  const checks = (a.manual_checks||[]).length ? `<div class="checks">请看：${a.manual_checks.map(esc).join("；")}</div>` : "";
  const parts = await Promise.all((a.files||[]).map(async f => {
    const url = artUrl(code, item, f.path), name = `<div class="name">${esc(f.path)}</div>`;
    if (f.too_big) return `<div class="artifact">${name}<span class="others">超过 ${Math.round(a.max_bytes/1048576)}MB，不在面板里打开</span></div>`;
    if (f.kind === "image") return `<div class="artifact">${name}<img src="${esc(url)}" alt="${esc(f.path)}" loading="lazy"></div>`;
    if (f.kind === "html") {
      const r = await fetch(url); const html = r.ok ? await r.text() : "读不出";
      return `<div class="artifact">${name}<iframe sandbox="allow-scripts" referrerpolicy="no-referrer" srcdoc="${esc(ART_CSP + html)}"></iframe></div>`;
    }
    return `<div class="artifact"><a href="${esc(url)}" download>${esc(f.path)}</a> <span class="others">${f.bytes} 字节</span></div>`;
  }));
  el.innerHTML = checks + (parts.join("") || '<span class="others">artifacts/ 下没有文件</span>');
}
function loadAllArtifacts(){ document.querySelectorAll(".artifacts[data-item]").forEach(loadArtifacts); }

async function refresh(){
  await loadProjects();
  if (cur === "*") {
    const all = await Promise.all(projects.map(async p => ({p, d: await api("api/p/"+p.code)})));
    const gates = all.flatMap(x => (x.d.gates||[]).map(g => gateCard(g, x.p.code, x.p.name)));
    $("main").innerHTML = `<div class="card others">这是只读的看效果页：批卡在 Telegram 里点。</div><h2>等你点头 · 全部项目</h2>${gates.join("") || '<div class="card empty">没有要你点头的</div>'}
      <h2>各项目</h2><div class="sum">${all.map(x => `<div class="card" onclick="pick('${x.p.code}')"><b>${esc(x.p.name)}</b>
      <div class="n">施工中 ${x.d.count?.building||0} · 可收菜 ${x.d.count?.merged||0} · 卡住 ${x.d.stuck||0}${(x.d.no_live_path||[]).length?` · <span class="nolive-mark">没活路 ${x.d.no_live_path.length}</span>`:""}</div></div>`).join("")}</div>`;
    loadAllArtifacts();
    return;
  }
  if (location.hash.startsWith("#item=")) return showItem(cur, decodeURIComponent(location.hash.slice(6)));
  data = await api("api/p/" + cur);
  const stuck = s => /交决策岗|有提问/.test(s.state) || s.stalled;
  const rl = (data.rate_limits||[]).map(r => `${esc(r.role)} 岗额度暂停到 ${esc((r.until||"").slice(5,16).replace("T"," "))}`).join("；");
  const roles = Object.entries((data.usage||{}).roles||{}).map(([r,u]) => `${esc(r)} ${u.runs} 次 / ${Math.round(u.minutes)} 分钟`).join(" · ");
  const tok = (data.usage||{}).tokens;
  const nolive = data.no_live_path||[], stale = data.stale||[];
  const rolesRow = (data.roles||[]).map(r => `<span class="role role-${esc(r.status)}" title="${esc(r.why||"")}">${esc(r.name)} · ${esc(r.label)}${(r.items||[]).length?" "+r.items.length:""}</span>`).join("");
  $("main").innerHTML = (data.paused ? `<div class="card" style="border-color:var(--warn)">⏸ 暂停：${esc(data.paused)}（处理好后 evo -p ${esc(cur)} resume）</div>` : "") +
    (data.main_red ? `<div class="card" style="border-color:var(--warn)">主线测试红了：在途的件先等着，不算它们返工（已登记一件修主线）</div>` : "") +
    (data.tick_running && data.tick_running.minutes > 1 ? `<div class="others" style="margin-bottom:6px">正在接棒一轮（已 ${esc(data.tick_running.minutes)} 分钟），下面是上次存盘的状态</div>` : "") +
    (rl ? `<div class="card" style="border-color:var(--warn)">⏸ ${rl}，到点自动恢复（不算返工）</div>` : "") +
    `<h2>岗位状态</h2><div class="roles">${rolesRow}</div>` +
    (nolive.length ? `<h2>没有活路</h2><div class="card alert nolive">${nolive.map(n => `<div><a class="ttl" href="#item=${esc(n.key)}">${esc(n.key)}</a> ${esc(n.title)} · ${esc(n.state)} · ${n.minutes} 分钟<div class="others">${esc(n.why)}（已交决策岗）</div></div>`).join("")}</div>` : "") +
    (stale.length ? `<h2>卡太久</h2><div class="card stale">${stale.map(x => `<div><a href="#item=${esc(x.key)}">${esc(x.key)}</a> ${esc(x.title)} · ${esc(x.state)} 已 ${x.hours} 小时</div>`).join("")}</div>` : "") + `
    <h2>等你点头</h2>${(data.gates||[]).map(g => gateCard(g, cur)).join("") || '<div class="card empty">没有要你点头的</div>'}
    <h2>每件进度</h2><div class="card"><table>${(data.items||[]).slice().reverse().map(it => `<tr class="item-row${it.no_live_path?" nolive":""}" onclick="location.hash='item='+encodeURIComponent('${esc(it.key)}')">
      <td class="key">${esc(it.key)}</td><td>${esc(it.title)}${it.round?` <span class="others">返工 ${it.round}</span>`:""}${it.window?` <span class="others">窗口 ${esc(it.window)}</span>`:""}
      <div class="others">派工 ${it.usage?.runs||0} 次 · ${Math.round(it.usage?.minutes||0)} 分钟${issueLink(it)}</div></td>
      <td style="text-align:right"><span class="st ${stuck(it)||it.no_live_path?"stuck":(/可收菜|已上线/.test(it.state)?"done":"")}">${it.no_live_path?"没有活路":it.stalled?"疑似卡住":esc(it.state)}</span></td></tr>`).join("") || '<tr><td class="empty">还没有件</td></tr>'}</table></div>
    <h2>项目目标</h2><div class="card others">${esc(data.goal||"（没写）")}<br>改：<code>evo -p ${esc(cur)} goal set "…"</code></div>
    <h2>用量</h2><div class="card others">${roles || "还没有派过工"}${tok ? `<br>token（magpie）：${Object.entries(tok.by_model||{}).map(([m,n]) => esc(m)+" "+n).join(" · ")}${tok.project?`；本项目 ${tok.project}`:""}` : ""}</div>
    <h2>最近动静</h2><div class="others" style="margin:-4px 0 6px">上次转动：${data.last_tick ? esc(data.last_tick.slice(5,16).replace("T"," ")) : "还没转过"}</div><div class="card log">${esc((data.log||[]).slice().reverse().join("\n")) || "（无）"}</div>`;
  loadAllArtifacts();
}

// 每件一页：时间线、交卷、diff、产出物、补充反馈
// 第二十轮：Multica 执行端的件带 issue 号；配了 multica.app_url 就能点开网页里的 issue（Orca 时代这里没有入口）
function issueLink(it){ const e = it.exec; if (!e || !e.issue) return "";
  return " · " + (e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Multica issue ${esc(e.issue)}</a>` : `Multica issue ${esc(e.issue)}`); }
const EV_NAMES = {exec_reseed:"换执行端", add:"登记", dispatch:"派工", report:"交卷", gate_open:"开闸门", gate_approve:"老板通过", gate_reject:"老板打回/不同意",
  gate_superseded:"旧闸门作废", gate_external:"Orca 端结闸门", msg_error:"消息出错已跳过", msg_stale:"过时回报已丢", main_red:"等主线修绿",
  decider_timeout:"决策岗卡住重叫", merge_error:"合并出错", feedback:"老板补充反馈", rework:"返工", merge:"合并", push:"推送", ship:"上线", deploy_failed:"上线失败",
  restart:"工人重启", decision:"决策岗决定", drop:"不做", state:"状态", no_live_path:"没有活路", live_again:"恢复活路"};
async function showItem(code, key){
  const d = await api(`api/item/${code}/${encodeURIComponent(key)}`);
  if (d.error) { $("main").innerHTML = `<p><a href="#">← 返回</a></p><div class="card empty">${esc(d.error)}</div>`; return; }
  const ev = e => { const x = Object.assign({}, e); ["at","item","event"].forEach(k => delete x[k]);
    const words = x.words || x.why || x.note || x.body || ""; ["words","why","note","body"].forEach(k => delete x[k]);
    return `<li><span class="at">${esc((e.at||"").slice(5,16).replace("T"," "))}</span><span class="ev">${esc(EV_NAMES[e.event]||e.event)}</span>
      <span class="others">${esc(Object.entries(x).map(([k,v]) => k+"="+(typeof v==="object"?JSON.stringify(v):v)).join(" "))}</span>
      ${x.sha?` <a href="api/diff/${code}/${encodeURIComponent(key)}" target="_blank" rel="noopener">diff</a>`:""}
      ${words?`<div class="words">${esc(words)}</div>`:""}</li>`; };
  const rep = d.report ? `<div class="card report"><b>交卷</b> <span class="others">${esc(d.report.status)}</span><div>${esc(d.report.summary)}</div>
    ${["unfinished","risks","manual_checks"].map(f => (d.report[f]||[]).length?`<div class="others">${f}：${d.report[f].map(x=>esc(typeof x==="object"?JSON.stringify(x):x)).join("；")}</div>`:"").join("")}</div>` : "";
  $("main").innerHTML = `<p><a href="#" onclick="location.hash='';return false">← 返回</a></p>
    <h2>${esc(key)} · ${esc(d.title||"")}</h2><div class="others" style="margin:-4px 0 8px">现在：${esc(d.state||"")}${d.has_diff?` · <a href="api/diff/${code}/${encodeURIComponent(key)}" target="_blank" rel="noopener">看 diff</a>`:""}</div>
    ${rep}<h2>产出物</h2><div class="card"><div class="artifacts" data-code="${esc(code)}" data-item="${esc(key)}"><span class="others">读取中…</span></div></div>
    <h2>补充反馈</h2><div class="card others">在这件的 GitHub issue 下评论，或 <code>evo -p ${esc(code)} feedback --item ${esc(key)} "…"</code></div>
    <h2>时间线</h2><div class="card"><ul class="timeline">${(d.events||[]).slice().reverse().map(ev).join("") || '<li class="empty">还没有记录</li>'}</ul></div>`;
  loadAllArtifacts();
}
window.addEventListener("hashchange", () => refresh());

refresh();
// 30 秒刷新一次（只读页，没有要保住的输入）
setInterval(refresh, 30000);
</script>
</body>
</html>
