# 每晚复盘：收集当天已合并的工作 → Retro Agent 更新 LESSONS.md → 开 PR 给维护者。
# 需要仓库 secret：ANTHROPIC_API_KEY（或替换成你使用的 agent action）。
name: evoloop-nightly-retro
on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 03:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      since:
        description: "起点（sha 或 git 日期，如 '3 days ago'）；留空=上次 lessons: 提交"
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
concurrency:
  group: evoloop-retro
  cancel-in-progress: false
jobs:
  retro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Collect retro context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          [ -n "${{ inputs.since }}" ] && args=(--since "${{ inputs.since }}")
          scripts/retro-collect.sh "${args[@]}" > retro-context.md
          echo "commits: $(grep -m1 '^- commits:' retro-context.md)"
          wc -c retro-context.md
      - name: Skip if nothing merged
        id: gate
        run: |
          n=$(grep -m1 '^- commits:' retro-context.md | grep -oE '[0-9]+' || echo 0)
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Date (Asia/Shanghai)
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"
      - name: Run Retro Agent
        if: steps.gate.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            你是本项目的 Nightly Retro Agent。严格按照 prompts/nightly-retro.md 执行。
            复盘上下文在 retro-context.md。今天的日期（Asia/Shanghai）：${{ env.TODAY }}。
            完成后在分支 evo/retro-${{ env.TODAY }} 上提交，开 PR，加标签 evo:retro。
          claude_args: "--allowedTools Bash(git:*),Bash(gh:*),Bash(python3 scripts/lessons.py:*),Read,Edit,Write"
